services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chtaw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: chtaw
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - chtaw_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chtaw -d chtaw"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
volumes:
  chtaw_pgdata:
