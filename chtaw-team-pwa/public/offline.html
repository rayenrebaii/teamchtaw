<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#16062f" />
    <title>Hors ligne · Team Chtaw</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #faf7ff;
        color: #29143e;
        font-family: system-ui;
      }
      main {
        padding: 35px;
        max-width: 430px;
        text-align: center;
      }
      span {
        display: inline-grid;
        place-items: center;
        background: #e9d5ff;
        border-radius: 20px;
        width: 75px;
        height: 75px;
        font-size: 40px;
        font-weight: 800;
      }
      h1 {
        font-size: 34px;
        letter-spacing: -1.5px;
      }
      p {
        color: #806b90;
        line-height: 1.7;
      }
      a {
        display: inline-block;
        background: #7c3aed;
        color: white;
        padding: 13px 22px;
        border-radius: 10px;
        text-decoration: none;
        margin-top: 15px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/branding/chtaw-logo.png" alt="Team Chtaw" width="176" height="98" style="display:block;margin:0 auto;border-radius:12px;max-width:100%;height:auto" />
      <h1>Une petite pause réseau.</h1>
      <p>
        La team sera toujours là à votre retour. Reconnectez-vous pour retrouver vos conversations.
        Les messages et les images privées ne sont pas enregistrés hors ligne.
      </p>
      <a href="/app">Réessayer</a>
    </main>
  </body>
</html>
